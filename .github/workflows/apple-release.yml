name: Apple Release Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/apple-release.yml'
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'Resources/web/**'
      - 'Resources/branding/**'
      - 'scripts/package_apple.sh'
      - 'scripts/build_apple.sh'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apple-release.yml'
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'Resources/web/**'
      - 'README.md'
      - 'LICENSE.md'
      - 'THIRD_PARTY_LICENSES.md'
      - 'scripts/package_apple.sh'
      - 'scripts/build_apple.sh'
      - 'Resources/branding/**'
      - 'docs/MACOS.md'
      - 'docs/UI_REDESIGN.md'

permissions:
  contents: read

concurrency:
  group: apple-release-${{ github.ref }}
  cancel-in-progress: true

env:
  SIEVE_VERSION: '1.0.0'
  JUCE_TAG: '8.0.12'
  JUCE_COMMIT: '29396c22c93392d6738e021b83196283d6e4d850'

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
            cmake_architectures: arm64
            auv3: 'ON'
            label: macOS arm64
          - runner: macos-15-intel
            architecture: x86_64
            cmake_architectures: x86_64
            auv3: 'OFF'
            label: macOS Intel
          - runner: macos-14
            architecture: universal
            cmake_architectures: 'arm64;x86_64'
            auv3: 'OFF'
            label: macOS Universal

    steps:
      - name: Check out Sieve
        uses: actions/checkout@v7

      - name: Show Apple toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          cmake --version

      - name: Restore JUCE cache
        id: juce-cache
        uses: actions/cache@v6
        with:
          path: JUCE
          key: juce-${{ env.JUCE_COMMIT }}

      - name: Fetch pinned JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git JUCE

      - name: Verify pinned JUCE
        run: |
          test "$(git -C JUCE rev-parse HEAD)" = "$JUCE_COMMIT"

      - name: Configure Xcode project
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_architectures }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DSIEVE_BUILD_AUV3="${{ matrix.auv3 }}" \
            -DSIEVE_JUCE_DIR="$GITHUB_WORKSPACE/JUCE"

      - name: Build Apple formats
        run: cmake --build build --config Release --target Sieve_All --parallel 3

      - name: Validate installed Audio Unit
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto build/Source/Sieve_artefacts/Release/AU/Sieve.component \
            "$HOME/Library/Audio/Plug-Ins/Components/Sieve.component"
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Siev UPBL

      - name: Package Apple artifacts
        env:
          SIEVE_ARCH: ${{ matrix.architecture }}
          BUILD_DIR: build
        run: |
          bash scripts/package_apple.sh

      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Sieve-v${{ env.SIEVE_VERSION }}-macos-${{ matrix.architecture }}
          path: |
            dist/Sieve-v${{ env.SIEVE_VERSION }}-macos-${{ matrix.architecture }}.zip
            dist/Sieve-v${{ env.SIEVE_VERSION }}-macos-${{ matrix.architecture }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
